[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Linux desktop shell for DeepSeek Harness"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
which = "6"
url = "2"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
